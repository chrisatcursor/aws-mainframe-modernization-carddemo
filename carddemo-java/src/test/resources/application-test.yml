spring:
  datasource:
    url: jdbc:h2:mem:carddemo_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  batch:
    jdbc:
      initialize-schema: embedded
    job:
      enabled: false
