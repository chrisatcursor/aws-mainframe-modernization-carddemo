<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Edit Card</title>
</head>
<body>
<section layout:fragment="content">
    <div class="card">
        <h3>Edit credit card</h3>

        <div th:if="${optimisticLockError}" class="message message-error" th:text="${optimisticLockError}"></div>

        <p class="inline-actions mb-2">
            <a th:href="@{/card/{cn}(cn=${card.cardNumber})}" class="btn btn-secondary">Cancel</a>
        </p>

        <form th:action="@{/card/{cn}/edit(cn=${card.cardNumber})}" th:object="${request}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" th:field="*{version}"/>

            <div class="form-group">
                <label for="cardNumberDisplay">Card Number</label>
                <input id="cardNumberDisplay" type="text" class="form-control" th:value="${card.cardNumber}" readonly
                       disabled/>
            </div>

            <div class="form-group">
                <label for="embossedName">Embossed Name</label>
                <input id="embossedName" type="text" class="form-control" th:field="*{embossedName}" maxlength="50"/>
                <span class="field-error" th:if="${#fields.hasErrors('embossedName')}" th:errors="*{embossedName}"></span>
            </div>

            <div class="form-group">
                <label for="expirationDate">Expiration Date</label>
                <input id="expirationDate" type="text" class="form-control" th:field="*{expirationDate}"
                       placeholder="YYYY-MM-DD" maxlength="10"/>
                <span class="field-error" th:if="${#fields.hasErrors('expirationDate')}" th:errors="*{expirationDate}"></span>
            </div>

            <div class="form-group">
                <label for="activeStatus">Active Status</label>
                <select id="activeStatus" class="form-control" th:field="*{activeStatus}">
                    <option value="Y">Y — Active</option>
                    <option value="N">N — Inactive</option>
                </select>
                <span class="field-error" th:if="${#fields.hasErrors('activeStatus')}" th:errors="*{activeStatus}"></span>
            </div>

            <div class="inline-actions">
                <button type="submit" class="btn btn-primary">Save</button>
                <a th:href="@{/card/{cn}(cn=${card.cardNumber})}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</section>
</body>
</html>
