<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Transactions</title>
</head>
<body>
<section layout:fragment="content">
    <div class="card">
        <h3>Transaction List</h3>

        <form th:action="@{/transaction/list}" method="get" class="mb-2">
            <div class="form-group">
                <label for="startId">Starting transaction ID</label>
                <input id="startId" type="text" name="startId" maxlength="16"
                       th:value="${startId}"/>
            </div>
            <input type="hidden" name="size" th:value="${pageSize}"/>
            <div class="inline-actions mt-1">
                <button type="submit" class="btn btn-primary">Search</button>
                <a th:href="@{/transaction/list(size=${pageSize})}" class="btn btn-secondary">Clear</a>
            </div>
        </form>

        <div class="mt-2">
            <table>
                <thead>
                <tr>
                    <th>Transaction ID</th>
                    <th>Card Number</th>
                    <th>Type</th>
                    <th class="text-right">Amount</th>
                    <th>Date</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="tx : ${page.content()}">
                    <td th:text="${tx.transactionId}">ID</td>
                    <td th:text="${tx.cardNumber}">Card</td>
                    <td th:text="${tx.typeCode}">Type</td>
                    <td class="text-right"
                        th:text="${tx.amount != null ? #numbers.formatCurrency(tx.amount) : '—'}">0.00</td>
                    <td th:text="${tx.originTimestamp}">Date</td>
                    <td>
                        <a th:href="@{/transaction/{id}(id=${tx.transactionId})}">View</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(page.content())}">
                    <td colspan="6">No transactions found.</td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="inline-actions mt-2">
            <a th:if="${page.hasPrevious()}"
               th:href="@{/transaction/list(page=${page.pageNumber() - 1}, size=${pageSize}, startId=${startId})}"
               class="btn btn-secondary">Previous</a>
            <a th:if="${page.hasNext()}"
               th:href="@{/transaction/list(page=${page.pageNumber() + 1}, size=${pageSize}, startId=${startId})}"
               class="btn btn-secondary">Next</a>
        </div>
    </div>
</section>
</body>
</html>
