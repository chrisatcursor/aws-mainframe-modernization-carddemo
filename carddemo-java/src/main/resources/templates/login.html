<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Sign On</title>
</head>
<body>
<section layout:fragment="content">
    <div class="login-container">
        <div class="card">
            <h3>CardDemo Sign On</h3>

            <div th:if="${param.error}" class="message message-error">
                Invalid User ID or Password. Please try again.
            </div>
            <div th:if="${param.logout}" class="message message-info">
                Thank you for using CardDemo application...
            </div>

            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label for="username">User ID</label>
                    <input type="text" id="username" name="username" maxlength="8"
                           autofocus required placeholder="Enter User ID"/>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" maxlength="8"
                           required placeholder="Enter Password"/>
                </div>
                <div class="mt-2">
                    <button type="submit" class="btn btn-primary" style="width:100%">Sign On</button>
                </div>
            </form>
        </div>
    </div>
</section>
</body>
</html>
