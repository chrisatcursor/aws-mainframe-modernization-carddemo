<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Batch Jobs</title>
</head>
<body>
<section layout:fragment="content">
    <div class="card">
        <h3>Phase 5 batch jobs</h3>
        <p class="muted">CBPAUP0C purge, COBTUPDT file update, IMS staging load/unload (pipe-delimited files).</p>
        <ul class="batch-list">
            <li>
                <form th:action="@{/admin/batch/run}" method="post" class="inline-form">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" name="job" value="purgeExpiredAuth"/>
                    <button type="submit" class="btn btn-primary">Run expired auth purge (CBPAUP0C)</button>
                </form>
            </li>
            <li>
                <form th:action="@{/admin/batch/run}" method="post" class="inline-form">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" name="job" value="transactionTypeFileUpdate"/>
                    <button type="submit" class="btn btn-primary">Run transaction type batch (COBTUPDT)</button>
                </form>
            </li>
            <li>
                <form th:action="@{/admin/batch/run}" method="post" class="inline-form">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" name="job" value="imsAuthStagingLoad"/>
                    <button type="submit" class="btn btn-secondary">IMS auth staging load (PAUDBLOD)</button>
                </form>
            </li>
            <li>
                <form th:action="@{/admin/batch/run}" method="post" class="inline-form">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" name="job" value="imsAuthStagingUnload"/>
                    <button type="submit" class="btn btn-secondary">IMS auth staging unload (PAUDBUNL / DBUNLDGS)</button>
                </form>
            </li>
        </ul>
        <p><a th:href="@{/admin/dashboard}">Admin menu</a></p>
    </div>
</section>
</body>
</html>
