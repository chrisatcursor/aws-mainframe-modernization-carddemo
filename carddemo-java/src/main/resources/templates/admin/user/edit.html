<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Edit User</title>
</head>
<body>
<section layout:fragment="content">
    <div class="card">
        <h3>Edit user</h3>

        <p class="inline-actions mb-2">
            <a th:href="@{/admin/user/list}" class="btn btn-secondary">Back to list</a>
        </p>

        <form th:action="@{/admin/user/update}" method="post">
            <input type="hidden" name="userId" th:value="${user.userId}"/>

            <div class="form-group">
                <label for="userIdDisplay">User ID</label>
                <input id="userIdDisplay" type="text" th:value="${user.userId}" class="form-control" readonly
                       disabled/>
            </div>
            <div class="form-group">
                <label for="firstName">First name</label>
                <input id="firstName" type="text" name="firstName" maxlength="20" class="form-control"
                       th:value="${user.firstName}"/>
            </div>
            <div class="form-group">
                <label for="lastName">Last name</label>
                <input id="lastName" type="text" name="lastName" maxlength="20" class="form-control"
                       th:value="${user.lastName}"/>
            </div>
            <div class="form-group">
                <label for="password">New password</label>
                <input id="password" type="password" name="password" class="form-control"
                       placeholder="Leave blank to keep current password" autocomplete="new-password"/>
            </div>
            <div class="form-group">
                <label for="userType">User type</label>
                <select id="userType" name="userType" class="form-control" required>
                    <option value="U" th:selected="${user.userType == null || user.userType.equalsIgnoreCase('U')}">Regular (U)</option>
                    <option value="A" th:selected="${user.userType != null && user.userType.equalsIgnoreCase('A')}">Admin (A)</option>
                </select>
            </div>
            <div class="inline-actions">
                <button type="submit" class="btn btn-primary">Save</button>
                <a th:href="@{/admin/user/list}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</section>
</body>
</html>
