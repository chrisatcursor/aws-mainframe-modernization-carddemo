<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Add User</title>
</head>
<body>
<section layout:fragment="content">
    <div class="card">
        <h3>Add user</h3>

        <p class="inline-actions mb-2">
            <a th:href="@{/admin/user/list}" class="btn btn-secondary">Back to list</a>
        </p>

        <form th:action="@{/admin/user/add}" method="post">
            <div class="form-group">
                <label for="userId">User ID</label>
                <input id="userId" type="text" name="userId" required maxlength="8" class="form-control"
                       autocomplete="username"/>
            </div>
            <div class="form-group">
                <label for="firstName">First name</label>
                <input id="firstName" type="text" name="firstName" maxlength="20" class="form-control"/>
            </div>
            <div class="form-group">
                <label for="lastName">Last name</label>
                <input id="lastName" type="text" name="lastName" maxlength="20" class="form-control"/>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" type="password" name="password" required class="form-control"
                       autocomplete="new-password"/>
            </div>
            <div class="form-group">
                <label for="userType">User type</label>
                <select id="userType" name="userType" class="form-control" required>
                    <option value="U">Regular (U)</option>
                    <option value="A">Admin (A)</option>
                </select>
            </div>
            <div class="inline-actions">
                <button type="submit" class="btn btn-primary">Create</button>
                <a th:href="@{/admin/user/list}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</section>
</body>
</html>
