<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Delete User</title>
</head>
<body>
<section layout:fragment="content">
    <div class="card">
        <h3>Delete user</h3>

        <p class="inline-actions mb-2">
            <a th:href="@{/admin/user/list}" class="btn btn-secondary">Back to list</a>
        </p>

        <p class="message message-error mb-2">This action cannot be undone. Confirm to delete the user below.</p>

        <div class="detail-grid mb-2">
            <div class="detail-label">User ID</div>
            <div class="detail-value" th:text="${user.userId}">USER0001</div>
            <div class="detail-label">First name</div>
            <div class="detail-value" th:text="${user.firstName}">Jane</div>
            <div class="detail-label">Last name</div>
            <div class="detail-value" th:text="${user.lastName}">Doe</div>
            <div class="detail-label">Type</div>
            <div class="detail-value" th:text="${user.userType == 'A' ? 'Admin' : 'Regular'}">Regular</div>
        </div>

        <form th:action="@{/admin/user/delete}" method="post">
            <input type="hidden" name="userId" th:value="${user.userId}"/>
            <div class="inline-actions">
                <button type="submit" class="btn btn-danger">Confirm delete</button>
                <a th:href="@{/admin/user/list}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</section>
</body>
</html>
