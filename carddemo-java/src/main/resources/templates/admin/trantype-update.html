<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Transaction type</title>
</head>
<body>
<section layout:fragment="content">
    <div class="card">
        <h3>Transaction type maintenance</h3>
        <form th:action="@{/admin/trantype/update}" th:object="${form}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="form-group">
                <label for="typeCode">Type code (2 chars)</label>
                <input id="typeCode" th:field="*{typeCode}" maxlength="2" class="form-control" required/>
            </div>
            <div class="form-group">
                <label for="typeDescription">Description</label>
                <input id="typeDescription" th:field="*{typeDescription}" maxlength="50" class="form-control"/>
            </div>
            <button type="submit" class="btn btn-primary">Save</button>
            <a th:href="@{/admin/trantype/list}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</section>
</body>
</html>
